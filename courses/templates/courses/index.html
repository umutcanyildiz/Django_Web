{% extends "layout.html" %}
{% block content %} <!--bu contentin içine yazılacak olanlar layout.html dosyasındaki contentin içine yazılacak-->
    <div class="container mt-3">
        <div class="row">
            <div class="col-3">
                <!--menu-->
                {% include "courses/partials/_categories.html" %} <!--categories partialini include ediyoruz-->

            </div>
            <div class="col-9">
                <!--content-->
                {% for kurs in courses %} <!--courses listesini döngüye alıyoruz-->
                    {% if kurs.isActive %} <!-- Eğer kurs aktifse -->
                      {% include "courses/partials/_course.html" %} <!--course partialini include ediyoruz-->
                    {% endif %}
                {% endfor %}

            </div>
        </div>
    </div>
{% endblock %}
{% block title %}Kurslar{% endblock %}
